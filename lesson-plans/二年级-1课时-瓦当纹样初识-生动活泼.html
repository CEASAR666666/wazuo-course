<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>二年级 瓦当纹样初识 教案</title>
  <style>
    body{margin:0;font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;color:#2C2825;background:#F7F3ED;}
    main{max-width:860px;margin:0 auto;padding:44px 22px 64px;}
    h1{font-family:"STKaiti","Kaiti SC",serif;font-size:42px;font-weight:500;margin:0 0 12px;color:#C8553D;}
    h2{margin:28px 0 10px;font-size:22px;}
    p,li{line-height:1.8;font-size:16px;}
    .meta{color:#6B6560;border-left:4px solid #C8553D;padding-left:12px;}
    .box{background:#fff;border:1px solid #D9D3CB;border-radius:12px;padding:18px 20px;margin-top:18px;}
    @media print{body{background:#fff}main{padding:18px}.box{break-inside:avoid}}
  </style>
</head>
<body>
  <main>
    <h1>瓦当纹样初识</h1>
    <p class="meta">二年级 · 1课时 · 生动活泼</p>
    <div class="box">
      <h2>教学定位</h2>
      <p>认识云纹、莲花、兽面和文字等常见纹样，感受纹样里的祝福。</p>
      <h2>教学目标</h2>
      <ol><li>能说出两到三种常见瓦当纹样。</li><li>能按图案特征进行简单分类。</li><li>能理解纹样常寄托吉祥愿望。</li></ol>
      <h2>教学过程</h2>
      <ol><li>观察多枚瓦当，找出重复出现的图案。</li><li>把纹样卡片按云、花、兽、字分类。</li><li>为自己的纹样写一句祝福语。</li></ol>
      <h2>课堂任务</h2>
      <p>学生完成观察记录、纹样说明或构件匹配，并用一句完整话说明判断依据。</p>
      <h2>评价建议</h2>
      <p>从观察准确、文化理解、合作表达、作品完成四个维度进行星级评价。</p>
    </div>
  </main>
</body>
</html>
